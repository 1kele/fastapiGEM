[project]
name = "fastapigem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Misha", email = "federalp@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "loguru>=0.8.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapigem = "fastapigem:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "radon>=6.0.1",
    "ruff>=0.17.4",
    "typing-extensions>=4.16.0",
]
